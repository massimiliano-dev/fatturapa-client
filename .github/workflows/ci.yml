name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Secrets scan, lint, typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  official-xsd:
    name: Validate the synthetic invoices against the official XSD (pinned SHA-256)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:schemas
      - run: pnpm vitest run --project unit packages/validator/test/official-xsd.test.ts

  # Smoke tests against the provider SANDBOXES only. Skipped unless the repository variable
  # FATTURAPA_LIVE is "sandbox". Never runs for pull requests (their code must not see the tokens); the
  # "sandbox" environment should require a manual approval.
  live-sandbox:
    name: Provider sandbox smoke tests
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name != 'pull_request' && vars.FATTURAPA_LIVE == 'sandbox' }}
    environment: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
        env:
          FATTURAPA_LIVE: sandbox
          OPENAPI_IT_SANDBOX_TOKEN: ${{ secrets.OPENAPI_IT_SANDBOX_TOKEN }}
          OPENAPI_IT_SANDBOX_FISCAL_ID: ${{ secrets.OPENAPI_IT_SANDBOX_FISCAL_ID }}
          FIC_ACCESS_TOKEN: ${{ secrets.FIC_ACCESS_TOKEN }}
          FIC_COMPANY_ID: ${{ secrets.FIC_COMPANY_ID }}
          INVOICETRONIC_SANDBOX_API_KEY: ${{ secrets.INVOICETRONIC_SANDBOX_API_KEY }}
          ACUBE_SANDBOX_EMAIL: ${{ secrets.ACUBE_SANDBOX_EMAIL }}
          ACUBE_SANDBOX_PASSWORD: ${{ secrets.ACUBE_SANDBOX_PASSWORD }}
          FEA_TEST_CLIENT_ID: ${{ secrets.FEA_TEST_CLIENT_ID }}
          FEA_TEST_CLIENT_SECRET: ${{ secrets.FEA_TEST_CLIENT_SECRET }}
          ARUBA_DEMO_USERNAME: ${{ secrets.ARUBA_DEMO_USERNAME }}
          ARUBA_DEMO_PASSWORD: ${{ secrets.ARUBA_DEMO_PASSWORD }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
